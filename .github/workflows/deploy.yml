name: Deploy

# Auto-deploys the backend image + both Cloud Run services on every push to
# `main`, but only after the CI workflow succeeds. Image tag is the commit
# SHA (so rollbacks are trivial) and `:latest` is moved as a convenience.
#
# One-time setup is in DEPLOY.md (Workload Identity Federation + a deployer
# service account). After that, this workflow needs zero maintenance.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  GCP_PROJECT: loupe-app-56235
  GCP_REGION: us-central1
  AR_REPO: loupe
  IMAGE_NAME: backend
  API_SERVICE: loupe-api
  WORKER_SERVICE: loupe-worker
  MIGRATE_JOB: loupe-migrate

jobs:
  deploy:
    # Only run if CI passed (or if manually dispatched).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image tag
        id: tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT="${SHA:0:12}"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${IMAGE_NAME}"
          echo "image_sha=${IMAGE}:${SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Cloud Build (push image)
        run: |
          # Use --async to avoid the "can't stream logs" failure when the
          # deployer SA lacks roles/logging.viewer. We poll the build
          # ourselves and fail explicitly on a non-SUCCESS terminal state.
          BUILD_ID=$(gcloud builds submit \
            --tag "${{ steps.tag.outputs.image_sha }}" \
            --project "${GCP_PROJECT}" \
            --region "${GCP_REGION}" \
            --async \
            --format='value(id)' \
            .)
          echo "Build ID: ${BUILD_ID}"
          while :; do
            STATUS=$(gcloud builds describe "${BUILD_ID}" \
              --project "${GCP_PROJECT}" --region "${GCP_REGION}" \
              --format='value(status)')
            echo "status=${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build terminal failure: ${STATUS}" >&2
                exit 1 ;;
              QUEUED|WORKING|PENDING) sleep 10 ;;
              *) echo "Unknown status '${STATUS}'" >&2; exit 1 ;;
            esac
          done

      - name: Run database migrations
        # MUST run before the API/worker pick up the new image, otherwise
        # new code that references unmigrated tables/columns will blow up
        # in prod (this is exactly what caused the card_external_refs
        # outage). Migrations are additive and idempotent — re-running
        # already-applied revisions is a no-op.
        run: |
          gcloud run jobs update "${MIGRATE_JOB}" \
            --image "${{ steps.tag.outputs.image_sha }}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --quiet
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --wait

      - name: Deploy loupe-api
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --image "${{ steps.tag.outputs.image_sha }}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --quiet

      - name: Deploy loupe-worker
        run: |
          gcloud run deploy "${WORKER_SERVICE}" \
            --image "${{ steps.tag.outputs.image_sha }}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --quiet

      - name: Smoke test /healthz
        run: |
          URL=$(gcloud run services describe "${API_SERVICE}" \
            --region "${GCP_REGION}" --project "${GCP_PROJECT}" \
            --format='value(status.url)')
          echo "API URL: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/healthz" >/dev/null; then
              echo "healthz OK"; exit 0
            fi
            echo "healthz retry $i..."; sleep 3
          done
          echo "healthz never returned 200"; exit 1

      - name: Tag image as :latest
        # Convenience tag only — failures here must not block the deploy.
        # (Past failure mode: missing artifactregistry.tags.delete perm
        # caused the whole pipeline to fail AFTER Cloud Build but BEFORE
        # migrations + service deploy, leaving prod on stale code.)
        continue-on-error: true
        run: |
          gcloud artifacts docker tags add \
            "${{ steps.tag.outputs.image_sha }}" \
            "${{ steps.tag.outputs.image_latest }}" \
            --quiet || echo "tag-as-latest skipped (non-fatal)"
